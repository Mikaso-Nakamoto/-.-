    keywords: ["сво", "фронт", "ростов", "белгород", "курск", "атака", "удар", "дрон", "бпла", "пво", "мост", "терминал", "военкор", "минобороны", "бои", "обстрел"]
    priority: "highest"

  - name: "Мировая геополитика & Международные отношения"
    keywords: ["россия", "сша", "китай", "трамп", "путин", "переговоры", "санкции", "дипломатия", "нато", "ес", "ближний восток"]
    priority: "high"

  - name: "Полезный софт & Open-Source"
    keywords: ["софт", "утилита", "open source", "репозиторий", "аналог", "photocraft", "wordcraft", "бесплатно", "замена", "инструмент", "github", "релиз", "программа", "soft"]
    priority: "high"

  - name: "Кибербезопасность & Право"
    keywords: ["киберполиция", "мвд", "хакер", "уязвимость", "взлом", "мошенничество", "фишинг", "cve", "инфобез", "exploit", "патч"]
    priority: "high"

  - name: "Нейросети, Hardware & ИИ"
    keywords: ["qwen", "llama", "deepseek", "openai", "gemini", "нейросеть", "llm", "nvidia", "gpu", "чип", "модель"]
    priority: "medium"

  - name: "DevOps & Self-Hosted"
    keywords: ["docker", "linux", "tailscale", "vpn", "ssh", "сервер", "wireguard", "self-hosted"]
    priority: "medium"

  - name: "Экономика и Финансы"
