user:
  name: "Пользователь"
  timezone: "Europe/Moscow"
  digest_time: "08:50"

interests:
  - name: "Нейросети и ИИ"
    keywords: ["qwen", "llama", "deepseek", "openai", "claude", "gemini", "нейросеть", "llm", "vllm", "ollama", "инференс"]
    priority: "high"

  - name: "Hardware & GPU"
    keywords: ["nvidia", "geforce", "rtx", "amd", "intel", "процессор", "видеокарта", "vram", "чип"]
    priority: "high"

  - name: "DevOps & Self-Hosted"
    keywords: ["docker", "linux", "tailscale", "vpn", "ssh", "сервер", "wireguard", "self-hosted", "kestra"]
    priority: "medium"

  - name: "Разработка и GameDev"
    keywords: ["python", "gamedev", "unreal", "unity", "github", "open source", "релиз"]
    priority: "medium"

filters:
  # Посты, содержащие эти слова, исключаются из сводки
  blacklist:
    - "реклама"
    - "промокод"
    - "партнерский материал"
    - "розыгрыш"
    - "airdrop"
    - "казино"
    - "подпишись на канал"
    - "переходи по ссылке в закрепе"

formatting:
  language: "ru"
  summary_depth: "balanced" # concise, balanced, detailed
  include_source_links: true
  max_news_per_topic: 4
