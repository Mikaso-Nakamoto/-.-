filters:
  # Жесткие стоп-слова для гарантированного отсечения скама (остальной отбор ведет ИИ-куратор)
  blacklist:
    - "казино"
    - "ставки на спорт"
    - "1win"
    - "1xbet"
    - "порно"
    - "крипто-скам"

formatting:
  language: "ru"
  summary_depth: "balanced" # concise, balanced, detailed
  include_source_links: true
  max_news_per_topic: 4
